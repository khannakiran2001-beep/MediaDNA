<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MediaDNA — Title Card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:Inter,system-ui,sans-serif; color:#fff; overflow:hidden;
    display:flex; align-items:center; justify-content:center; height:100vh;
    background:
      radial-gradient(1000px 600px at 80% -10%, #2a1e6e 0%, transparent 55%),
      radial-gradient(800px 500px at 0% 110%, #0d2b3a 0%, transparent 55%), #07070c;
  }
  .wrap { text-align:center; animation:in 1s ease both; }
  @keyframes in { from { opacity:0; transform:translateY(20px) scale(.98);} to { opacity:1; transform:none; } }
  .logo { width:96px; height:96px; border-radius:24px; margin:0 auto 28px;
    background:linear-gradient(135deg,#7c5cff,#22d3ee); box-shadow:0 20px 80px -20px #7c5cff88;
    animation:pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  h1 { font-size:5rem; font-weight:900; letter-spacing:-.03em; line-height:1; }
  .grad { background:linear-gradient(90deg,#a78bfa,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { margin-top:18px; font-size:1.6rem; font-weight:600; color:#cbd5e1; }
  .sub { margin-top:26px; font-size:1rem; color:#8892a6; letter-spacing:.02em; }
  .chip { display:inline-flex; gap:8px; align-items:center; margin-top:34px; padding:10px 18px;
    border:1px solid #ffffff22; border-radius:999px; font-size:.95rem; color:#c7d2fe;
    background:rgba(255,255,255,.04); }
  .dot { width:8px; height:8px; border-radius:50%; background:#34d399; }
  .toggle { position:fixed; bottom:16px; right:16px; font-size:.8rem; color:#64748b;
    background:#ffffff10; border:1px solid #ffffff20; border-radius:8px; padding:6px 10px; cursor:pointer; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"></div>
    <h1>Media<span class="grad">DNA</span></h1>
    <div class="tag" id="tag">GitHub for AI Assets</div>
    <div class="sub" id="sub">Permanent identity · complete lineage · verified provenance</div>
    <div class="chip"><span class="dot"></span> Built on Genblaze + Backblaze B2</div>
  </div>
  <button class="toggle" onclick="outro()">Show outro variant</button>
  <script>
    // Press the button (or call outro()) for the closing card.
    function outro() {
      document.getElementById('tag').textContent = 'Give your AI assets a memory.';
      document.getElementById('sub').textContent = 'Generate · trace · search · version — all in one place';
    }
  </script>
</body>
</html>
